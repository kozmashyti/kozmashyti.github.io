<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your country or region">
    <title>Country / Region | Kozma Shyti</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="languages.css">
</head>
<body>
    <header class="language-page-nav">
        <div class="language-nav-inner">
            <a href="index.html" class="language-page-logo" aria-label="Portfolio">
                <img src="logo.png" alt="Kozma Shyti logo">
            </a>

            <div class="language-nav-actions">
                <a href="index.html" class="language-back">Portfolio</a>
                <button
                    id="languagesThemeBtn"
                    class="language-theme-btn"
                    type="button"
                    aria-label="Change theme"
                >☾</button>
            </div>
        </div>
    </header>

    <main>
        <section class="language-hero">
            <div class="language-container">
                <p class="language-kicker">COUNTRY / REGION</p>
                <h1>Choose your <span>country or region.</span></h1>

                <p class="language-intro">
                    Choose your country or region, then select the language you want to use on the portfolio.
                </p>

                <div class="language-search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                    <input
                        id="countrySearch"
                        type="search"
                        placeholder="Search country, region or language..."
                        autocomplete="off"
                    >
                </div>

                <p id="countryStatus" class="language-status" aria-live="polite"></p>
            </div>
        </section>

        <section class="country-directory-section">
            <div class="language-container">
                <div class="country-toolbar">
                    <div>
                        <p class="language-section-kicker">GLOBAL DIRECTORY</p>
                        <h2>Country / Region</h2>
                    </div>
                    <span id="countryCount" class="language-count"></span>
                </div>

                <div id="countryRegions"></div>

                <div id="countryEmpty" class="language-empty" hidden>
                    No countries found.
                </div>
            </div>
        </section>
    </main>

    <footer class="page-simple-footer">
        <div class="page-simple-footer-inner">
            <span>© 2026 Kozma Shyti</span>
            <span class="page-rights">All Rights Reserved</span>
        </div>
    </footer>


    <script src="languages.js"></script>
</body>
</html>
